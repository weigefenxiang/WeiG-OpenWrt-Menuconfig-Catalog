name: Recover catalog-dev from verified F snapshot

on:
  push:
    branches: [fix-F]
    paths:
      - ".github/workflows/f-recover-catalog-dev.yml"

permissions:
  contents: write

concurrency:
  group: catalog-write-catalog-dev
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Restore exact verified snapshot to catalog-dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/catalog-channels.mjs validate-promotion dev catalog-fix-F >/dev/null
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          dev_sha="$(git ls-remote "$remote" refs/heads/dev | awk '{print $1}')"
          [[ "$dev_sha" =~ ^[0-9a-f]{40}$ ]]
          git clone --depth 1 --single-branch --branch catalog-fix-F "$remote" source
          git clone --depth 1 --single-branch --branch catalog-dev "$remote" target
          node scripts/sync-index-assets.mjs source --check
          readarray -t identity < <(node - <<'NODE'
          const i = require('./source/index.json');
          if (i?.provenance?.complete !== true || i?.provenance?.codeRef !== 'fix-F') {
            throw new Error('catalog-fix-F is not a complete verified F snapshot');
          }
          console.log(String(i.assetRef || '').trim().toLowerCase());
          console.log(String(i.provenance.codeSha || '').trim().toLowerCase());
          NODE
          )
          asset_ref="${identity[0]}"
          [[ "$asset_ref" =~ ^[0-9a-f]{40}$ ]]
          git -C source fetch --depth 1 origin "$asset_ref"
          git -C source cat-file -e "${asset_ref}^{commit}"
          rsync -a --delete --exclude=.git source/ target/
          node scripts/stamp-catalog-snapshot.mjs target/index.json "$asset_ref" dev "$dev_sha" true
          node scripts/sync-index-assets.mjs target --check
          git -C target config user.name github-actions[bot]
          git -C target config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C target add -A
          git -C target commit -m "data: restore verified F Catalog snapshot"
          git -C target push origin HEAD:catalog-dev
          echo "Restored catalog-dev from assetRef $asset_ref for dev $dev_sha"
