name: one-shot dispatch fix-F3 Catalog reuse
on:
  push:
    branches: [fix-F3]
    paths:
      - '.github/workflows/one-shot-dispatch-f3-reuse.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel stuck seed and dispatch validated sibling reuse
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/31942867747/cancel" || true
          sleep 3
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-reuse.yml/dispatches" --input - <<'JSON'
          {"ref":"fix-F3","inputs":{"source_data_branch":"catalog-fix-F"}}
          JSON
