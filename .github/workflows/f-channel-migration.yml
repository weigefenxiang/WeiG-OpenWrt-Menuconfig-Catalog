name: F channel migration validation

on:
  push:
    branches: [fix-F]
    paths:
      - ".f-channel-migration.py"
      - ".github/workflows/f-channel-migration.yml"

permissions:
  contents: write

concurrency:
  group: f-channel-migration-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Fix validator anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.f-channel-migration.py')
          text = path.read_text(encoding='utf-8')
          old = """    if text.count(item) != 1:\n        raise SystemExit(f'impact full removal mismatch: {item!r} -> {text.count(item)}')\n    text = text.replace(item, '', 1)\n"""
          new = """    expected = 2 if item == \"    '.github/workflows/catalog.yml',\\n\" else 1\n    if text.count(item) != expected:\n        raise SystemExit(f'impact full removal mismatch: {item!r} -> {text.count(item)}')\n    text = text.replace(item, '', 1)\n"""
          if text.count(old) != 1:
              raise SystemExit('validator anchor not found')
          text = text.replace(old, new, 1)
          anchor = "write('scripts/check-catalog-snapshot.mjs', text)\n"
          patch = """if text.count(\"\\n    'fix-E',\\n\") != 2:\n    raise SystemExit('generic snapshot CLI fix-E anchors changed')\ntext = text.replace(\"\\n    'fix-E',\\n\", \"\\n    'fix-F',\\n\")\nwrite('scripts/check-catalog-snapshot.mjs', text)\n"""
          if text.count(anchor) != 1:
              raise SystemExit('snapshot write anchor not found')
          text = text.replace(anchor, patch, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Apply complete intended migration in workspace
        run: python3 .f-channel-migration.py
      - name: Align release trigger regression with Data Surface Gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-release-publication.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''for (const needle of [\n  '- "scripts/**"',\n  '- "translations/**"',\n  '- "*.json"',\n  '- ".github/workflows/catalog.yml"',\n  'node scripts/catalog-change-impact.mjs',\n  "needs.mode.outputs.mode == 'full'",\n  "needs.mode.outputs.mode == 'root-assets'",\n]) {\n  assert(catalog.includes(needle), `catalog trigger/router contract missing: ${needle}`);\n}\nfor (const legacy of ['!scripts/package-probe-*.mjs', '!scripts/run-package-probe.mjs',\n  '!scripts/write-package-probe-evidence.mjs']) {\n  assert(!catalog.includes(legacy), `legacy trigger blacklist returned: ${legacy}`);\n}\n'''
          new = '''for (const needle of [\n  '- "catalog.config.json"',\n  '- "compatibility.json"',\n  '- "curated-sizes.json"',\n  '- "translations/menu-i18n.json"',\n  '- "translations/zh-CN.json"',\n  '- "translations/probe-ui.json"',\n  '- "scripts/generate-catalog.mjs"',\n  '- "scripts/build-index.mjs"',\n  'node scripts/catalog-change-impact.mjs',\n  "needs.mode.outputs.mode == 'full'",\n  "needs.mode.outputs.mode == 'root-assets'",\n]) {\n  assert(catalog.includes(needle), `catalog runtime trigger/router contract missing: ${needle}`);\n}\nfor (const forbidden of [\n  '- "scripts/**"', '- "translations/**"', '- "*.json"', '- ".github/workflows/catalog.yml"',\n  '!scripts/package-probe-*.mjs', '!scripts/run-package-probe.mjs', '!scripts/write-package-probe-evidence.mjs',\n]) {\n  assert(!catalog.includes(forbidden), `non-runtime Catalog trigger returned: ${forbidden}`);\n}\n'''
          if text.count(old) != 1:
              raise SystemExit('release trigger contract anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Run Catalog contract suite
        run: npm test
      - name: Restore workflow files before bot commit
        run: git checkout -- .github/workflows/catalog.yml .github/workflows/catalog-reuse.yml .github/workflows/catalog-production.yml .github/workflows/probe-contracts.yml
      - name: Commit tested non-workflow changes and workflow outputs
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/catalog-channels.mjs \
            scripts/stamp-catalog-snapshot.mjs \
            scripts/catalog-change-impact.mjs \
            scripts/check-catalog-change-impact.mjs \
            scripts/check-catalog-snapshot.mjs \
            scripts/check-production-boundary.mjs \
            scripts/check-release-publication.mjs \
            .f-output-catalog.yml \
            .f-output-catalog-reuse.yml \
            .f-output-catalog-production.yml \
            .f-output-probe-contracts.yml
          git diff --cached --stat
          git commit -m "refactor: standardize Catalog channel promotion"
          git push origin HEAD:fix-F
