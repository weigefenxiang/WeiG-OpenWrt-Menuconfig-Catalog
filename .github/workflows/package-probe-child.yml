name: Package probe child
run-name: Package probe · ${{ inputs.probe_id }} · ${{ inputs.source }}/${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      probe_id: { required: true, type: string }
      source: { required: true, type: string }
      repo: { required: true, type: string }
      branch: { required: true, type: string }
      packages: { required: true, type: string }
      mode: { required: true, type: string }

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PROBE_ID: ${{ inputs.probe_id }}
      PROBE_SOURCE: ${{ inputs.source }}
      PROBE_REPO: ${{ inputs.repo }}
      PROBE_BRANCH: ${{ inputs.branch }}
      PROBE_PACKAGES: ${{ inputs.packages }}
      PROBE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - name: Clone only the selected Source/Branch history
        run: bash scripts/clone-upstream.sh "https://github.com/${{ inputs.repo }}" "${{ inputs.branch }}" work/upstream
      - name: Install feeds
        working-directory: work/upstream
        run: ./scripts/feeds update -a && ./scripts/feeds install -a
      - name: Compile selected packages without building firmware images
        id: build
        working-directory: work/upstream
        shell: bash
        run: |
          set -o pipefail
          {
            printf 'CONFIG_TARGET_x86=y\nCONFIG_TARGET_x86_64=y\n' > .config
            IFS=',' read -ra packages <<< "$PROBE_PACKAGES"
            package_state=m
            if [[ "$PROBE_MODE" == co-install ]]; then package_state=y; fi
            for package in "${packages[@]}"; do
              printf 'CONFIG_PACKAGE_%s=%s\n' "$package" "$package_state" >> .config
            done
            make defconfig
            make -j"$(nproc)" tools/install toolchain/install
            make -j"$(nproc)" package/compile V=s
            if [[ "$PROBE_MODE" == co-install ]]; then
              make -j1 package/install V=s
            fi
          } 2>&1 | tee "$GITHUB_WORKSPACE/probe.log"
      - name: Write normalized evidence
        if: always()
        env:
          PROBE_CONCLUSION: ${{ steps.build.outcome }}
        run: node scripts/write-package-probe-evidence.mjs
      - name: Upload normalized evidence and full log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.probe_id }}-evidence
          path: |
            probe-evidence/
            probe.log
          retention-days: 60
          if-no-files-found: error
