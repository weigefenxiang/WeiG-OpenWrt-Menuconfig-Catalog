name: Required CI / 必需检查
run-name: Required CI · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: [main, dev, staging, "fix/**"]
  pull_request:
    branches: [main, dev, staging]

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests / 测试
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout / 检出
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js / 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify runtime / 检查运行环境
        run: |
          node --version
          npm --version

      - name: Run repository contracts / 运行仓库契约检查
        run: npm test

      - name: Check committed whitespace / 检查提交格式
        shell: bash
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi
