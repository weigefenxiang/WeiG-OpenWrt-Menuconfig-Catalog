name: Refresh curated package sizes
run-name: Curated package sizes · ${{ github.event_name }} · run ${{ github.run_number }}

on:
  workflow_dispatch:
  schedule:
    - cron: "43 21 * * 6"

permissions:
  contents: write

concurrency:
  group: curated-package-sizes-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Collect official APK package indexes
        run: node scripts/collect-curated-size-samples.mjs size-samples
      - name: Recalculate curated dependency closures
        run: node scripts/refresh-curated-sizes.mjs --samples size-samples --write
      - name: Verify Catalog data
        run: npm test
      - name: Publish changed size observations
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add curated-sizes.json
          if git diff --cached --quiet; then
            echo "Curated package sizes are unchanged."
            exit 0
          fi
          git commit -m "data: refresh curated package sizes"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Upload size coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: curated-size-samples-${{ github.run_id }}-${{ github.run_attempt }}
          path: size-samples/
          retention-days: 60
          if-no-files-found: warn
