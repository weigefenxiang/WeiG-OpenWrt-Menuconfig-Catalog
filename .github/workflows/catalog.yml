name: Build Menuconfig Catalog
run-name: Menuconfig catalog · ${{ github.event_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * 6"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "catalog.config.json"
      - ".github/workflows/catalog.yml"

permissions:
  contents: write

concurrency:
  group: menuconfig-catalog
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/discover.mjs >> "$GITHUB_OUTPUT"

  generate:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install catalog dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget
      - name: Clone ${{ matrix.repo }} @ ${{ matrix.branch }}
        run: git clone "https://github.com/${{ matrix.repo }}" --branch "${{ matrix.branch }}" --depth 1 work/upstream
      - name: Prepare feeds and upstream metadata
        working-directory: work/upstream
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          test -s tmp/.targetinfo
          test -s tmp/.packageinfo
      - name: Extract catalog
        run: |
          node scripts/generate-catalog.mjs \
            --source-id "${{ matrix.source }}" \
            --label "${{ matrix.label }}" \
            --repo "${{ matrix.repo }}" \
            --branch "${{ matrix.branch }}" \
            --legacy "${{ matrix.legacy }}" \
            --tree work/upstream \
            --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ matrix.source }}-${{ strategy.job-index }}
          path: |
            dist/*.json.gz
            dist/*.meta.json
          retention-days: 2
          if-no-files-found: error

  publish:
    needs: [discover, generate]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-*
          path: current
          merge-multiple: true
      - name: Keep last successful branch entries
        run: |
          git clone --branch catalog-data --depth 1 \
            "https://github.com/${{ github.repository }}" previous || true
          mkdir -p dist
          cp previous/*.json.gz dist/ 2>/dev/null || true
          cp current/*.json.gz current/*.meta.json dist/
      - name: Build catalog index
        run: node scripts/build-index.mjs dist dist/index.json previous/index.json
      - name: Publish catalog-data branch
        run: |
          cd dist
          rm -f -- *.meta.json
          git init
          git checkout -b catalog-data
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.json *.json.gz
          git commit -m "data: refresh menuconfig catalog"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git push --force origin catalog-data
