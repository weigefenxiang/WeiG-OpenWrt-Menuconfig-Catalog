name: Build Menuconfig Catalog
run-name: Menuconfig catalog · ${{ github.event_name }} · run ${{ github.run_number }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * 6"
  push:
    branches: [main, dev, staging, "fix/**"]
    paths:
      - "scripts/**"
      - "catalog.config.json"
      - "compatibility.json"
      - "curated-sizes.json"
      - ".github/workflows/catalog.yml"

permissions:
  contents: write

concurrency:
  group: menuconfig-catalog
  cancel-in-progress: false

jobs:
  mode:
    name: 00 · Select publish mode / 选择发布模式
    runs-on: ubuntu-24.04
    outputs:
      fast_asset: ${{ steps.mode.outputs.fast_asset }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: mode
        name: Detect root-asset-only push
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          fast_asset=none
          if [[ "$GITHUB_EVENT_NAME" == push && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ &&
                "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]] &&
             git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
            if [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == compatibility.json ]]; then
              fast_asset=compatibility
            elif [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == curated-sizes.json ]]; then
              fast_asset=applications
            fi
          fi
          echo "fast_asset=$fast_asset" >> "$GITHUB_OUTPUT"

  discover:
    name: 01 · Discover / 发现源码分支
    needs: mode
    if: needs.mode.outputs.fast_asset == 'none'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      publish-order: ${{ steps.matrix.outputs.publish-order }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        name: Discover branches and assign numbers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics
          if node scripts/discover.mjs > "$RUNNER_TEMP/discover.outputs" 2> diagnostics/01-discover.log; then
            cat "$RUNNER_TEMP/discover.outputs" >> "$GITHUB_OUTPUT"
            rm -f diagnostics/01-discover.log
          else
            rc=$?
            {
              echo "WeiG Menuconfig Catalog discovery summary"
              echo "Final status: failure"
              echo "Run ID: $GITHUB_RUN_ID"
              echo "Run attempt: $GITHUB_RUN_ATTEMPT"
              echo "Run URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > diagnostics/01-discover--SUMMARY.txt
            tail -n 80 diagnostics/01-discover.log
            exit "$rc"
          fi
      - name: Upload 01 discovery diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 01-discover-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: diagnostics/
          retention-days: 60
          if-no-files-found: error

  generate:
    name: ${{ matrix.jobName }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CATALOG_SOURCE_ID: ${{ matrix.source }}
      CATALOG_SOURCE_LABEL: ${{ matrix.label }}
      CATALOG_REPO: ${{ matrix.repo }}
      CATALOG_BRANCH: ${{ matrix.branch }}
      CATALOG_VERSION: ${{ matrix.version }}
      CATALOG_COMPAT: ${{ matrix.metadataCompat }}
      CATALOG_JOB_KEY: ${{ matrix.jobKey }}
      CATALOG_ORDER: ${{ matrix.orderText }}
      CATALOG_JOB_NAME: ${{ matrix.jobName }}
      CATALOG_RUN_ID: ${{ github.run_id }}
      CATALOG_RUN_ATTEMPT: ${{ github.run_attempt }}
      CATALOG_JOB_INDEX: ${{ strategy.job-index }}
      CATALOG_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CATALOG_ARTIFACT_NAME: ${{ matrix.artifactPrefix }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify runner tools
        id: tools
        timeout-minutes: 2
        run: |
          bash scripts/run-stage.sh tools bash -c \
            'for tool in git make gcc g++ perl python3 rsync; do command -v "$tool" || { echo "missing runner tool: $tool"; exit 1; }; done'
      - name: Clone ${{ matrix.repo }} @ ${{ matrix.branch }}
        id: clone
        timeout-minutes: 10
        run: bash scripts/run-stage.sh clone bash scripts/clone-upstream.sh "https://github.com/${{ matrix.repo }}" "${{ matrix.branch }}" work/upstream
      - name: Prepare feeds
        id: feeds
        timeout-minutes: 25
        working-directory: work/upstream
        run: bash "$GITHUB_WORKSPACE/scripts/run-stage.sh" feeds bash -c './scripts/feeds update -a && ./scripts/feeds install -a'
      - name: Generate upstream metadata
        id: metadata
        timeout-minutes: 15
        working-directory: work/upstream
        run: bash "$GITHUB_WORKSPACE/scripts/run-stage.sh" metadata bash "$GITHUB_WORKSPACE/scripts/prepare-metadata.sh" "${{ matrix.metadataCompat }}"
      - name: Extract catalog
        id: extract
        timeout-minutes: 5
        run: |
          bash scripts/run-stage.sh extract node scripts/generate-catalog.mjs \
            --source-id "${{ matrix.source }}" \
            --label "${{ matrix.label }}" \
            --repo "${{ matrix.repo }}" \
            --branch "${{ matrix.branch }}" \
            --legacy "${{ matrix.legacy }}" \
            --tree work/upstream \
            --out dist
      - name: Verify Target/Profile Kconfig contracts
        id: kconfig_contract
        if: steps.extract.outcome == 'success'
        timeout-minutes: 12
        run: |
          bash scripts/run-stage.sh kconfig-contract node scripts/verify-target-contracts.mjs \
            --tree work/upstream \
            --source-id "${{ matrix.source }}" \
            --branch "${{ matrix.branch }}" \
            --out dist
      - name: Record branch attempt
        if: always()
        env:
          SOURCE_ID: ${{ matrix.source }}
          SOURCE_LABEL: ${{ matrix.label }}
          SOURCE_REPO: ${{ matrix.repo }}
          SOURCE_BRANCH: ${{ matrix.branch }}
          SOURCE_VERSION: ${{ matrix.version }}
          SOURCE_LEGACY: ${{ matrix.legacy }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_INDEX: ${{ strategy.job-index }}
          CATALOG_ORDER: ${{ matrix.orderText }}
          CATALOG_JOB_NAME: ${{ matrix.jobName }}
          CATALOG_JOB_KEY: ${{ matrix.jobKey }}
          CATALOG_ARTIFACT_NAME: ${{ matrix.artifactPrefix }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          METADATA_COMPAT: ${{ matrix.metadataCompat }}
          JOB_STATUS: ${{ job.status }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          CLONE_OUTCOME: ${{ steps.clone.outcome }}
          FEEDS_OUTCOME: ${{ steps.feeds.outcome }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          KCONFIG_CONTRACT_OUTCOME: ${{ steps.kconfig_contract.outcome }}
        run: node scripts/write-attempt.mjs
      - name: Upload branch result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifactPrefix }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            dist/*.json.gz
            dist/*.meta.json
            dist/*.contract.json
            dist/*.translations.json
            dist/*.duplicates.json
            dist/*.curated-candidates.json
            attempts/*.attempt.json
            attempts/*--SUMMARY.txt
            failure-logs/*.log
          retention-days: 60
          if-no-files-found: error

  publish-root-asset:
    name: 02 · Publish ${{ needs.mode.outputs.fast_asset }} only / 仅发布根资产
    needs: mode
    if: needs.mode.outputs.fast_asset != 'none'
    runs-on: ubuntu-24.04
    env:
      CATALOG_DATA_BRANCH: ${{ startsWith(github.ref_name, 'fix/') && 'catalog-fix' || github.ref_name == 'dev' && 'catalog-dev' || github.ref_name == 'staging' && 'catalog-staging' || github.ref_name == 'main' && 'catalog-data' || '' }}
      FAST_ASSET: ${{ needs.mode.outputs.fast_asset }}
    steps:
      - name: Validate publish channel
        run: |
          case "$CATALOG_DATA_BRANCH" in
            catalog-fix|catalog-dev|catalog-staging|catalog-data) ;;
            *) echo "unsupported Catalog code branch: $GITHUB_REF_NAME"; exit 1 ;;
          esac
          if [[ "$GITHUB_REF_NAME" != main && "$CATALOG_DATA_BRANCH" == catalog-data ]]; then
            echo "non-main code may not publish catalog-data"
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Fetch only the current root-asset contract
        run: |
          case "$FAST_ASSET" in
            compatibility|applications) ;;
            *) echo "unsupported fast asset: $FAST_ASSET"; exit 1 ;;
          esac
          git clone --filter=blob:none --no-checkout --single-branch \
            --branch "$CATALOG_DATA_BRANCH" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previous
          git -C previous sparse-checkout init --no-cone
          git -C previous sparse-checkout set /index.json "/$FAST_ASSET.json.gz"
          git -C previous checkout "$CATALOG_DATA_BRANCH"
          test -f previous/index.json
          test -f "previous/$FAST_ASSET.json.gz"
      - name: Rebuild root-asset contract
        run: node scripts/build-index.mjs "--$FAST_ASSET-only" previous/index.json previous/index.json
      - name: Publish root-asset contract
        run: |
          set -euo pipefail
          git -C previous config user.name github-actions[bot]
          git -C previous config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C previous add --sparse index.json "$FAST_ASSET.json.gz"
          if git -C previous diff --cached --quiet; then
            echo "$FAST_ASSET contract is unchanged; nothing to publish."
            exit 0
          fi
          git -C previous commit -m "data: refresh $FAST_ASSET asset"
          asset_commit="$(git -C previous rev-parse HEAD)"
          node scripts/stamp-catalog-snapshot.mjs previous/index.json "$asset_commit"
          git -C previous add --sparse index.json
          if ! git -C previous diff --cached --quiet; then
            git -C previous commit -m "data: pin $FAST_ASSET snapshot"
          fi
          git -C previous push origin "HEAD:$CATALOG_DATA_BRANCH"

  publish:
    name: ${{ needs.discover.outputs.publish-order }} · Publish / 发布目录与 Release
    needs: [discover, generate]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-24.04
    env:
      CATALOG_DATA_BRANCH: ${{ startsWith(github.ref_name, 'fix/') && 'catalog-fix' || github.ref_name == 'dev' && 'catalog-dev' || github.ref_name == 'staging' && 'catalog-staging' || github.ref_name == 'main' && 'catalog-data' || '' }}
      CATALOG_ORDER: ${{ needs.discover.outputs.publish-order }}
      CATALOG_JOB_KEY: publish
      CATALOG_JOB_NAME: ${{ needs.discover.outputs.publish-order }} · Publish / 发布目录与 Release
      CATALOG_RUN_ID: ${{ github.run_id }}
      CATALOG_RUN_ATTEMPT: ${{ github.run_attempt }}
      CATALOG_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CATALOG_ARTIFACT_NAME: ${{ needs.discover.outputs.publish-order }}-publish-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    steps:
      - name: Validate publish channel
        run: |
          case "$CATALOG_DATA_BRANCH" in
            catalog-fix|catalog-dev|catalog-staging|catalog-data) ;;
            *) echo "unsupported Catalog code branch: $GITHUB_REF_NAME"; exit 1 ;;
          esac
          if [[ "$GITHUB_REF_NAME" != main && "$CATALOG_DATA_BRANCH" == catalog-data ]]; then
            echo "non-main code may not publish catalog-data"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-catalog-*"
          path: current
      - name: Keep last successful branch entries
        id: collect
        continue-on-error: true
        run: |
          git clone --branch "$CATALOG_DATA_BRANCH" --depth 1 --single-branch --no-tags --filter=blob:none \
            "https://github.com/${{ github.repository }}" previous || true
          bash scripts/run-stage.sh collect node scripts/collect-results.mjs \
            current previous dist current-attempts publish-diagnostics
      - name: Build catalog index
        id: index
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: bash scripts/run-stage.sh index node scripts/build-index.mjs dist dist/index.json previous/index.json current-attempts
      - name: Publish Catalog data branch
        id: data
        if: steps.collect.outcome == 'success' && steps.index.outcome == 'success'
        continue-on-error: true
        run: |
          bash scripts/run-stage.sh publish-data bash -c '
            set -euo pipefail
            if [[ ! -d previous/.git ]]; then
              rm -rf previous
              git init previous
              git -C previous checkout -b "$CATALOG_DATA_BRANCH"
            fi
            git -C previous config user.name github-actions[bot]
            git -C previous config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git -C previous remote remove origin 2>/dev/null || true
            git -C previous remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
            find previous -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
            cp -a dist/. previous/
            rm -f -- previous/*.meta.json
            git -C previous add -A
            if ! git -C previous diff --cached --quiet; then
              git -C previous commit -m "data: refresh menuconfig catalog"
            fi
            asset_commit="$(git -C previous rev-parse HEAD)"
            node scripts/stamp-catalog-snapshot.mjs previous/index.json "$asset_commit"
            node scripts/sync-index-assets.mjs previous --check
            git -C previous add index.json
            if ! git -C previous diff --cached --quiet; then
              git -C previous commit -m "data: pin menuconfig catalog assets"
            fi
            git -C previous push origin "HEAD:$CATALOG_DATA_BRANCH"
            cp previous/index.json dist/index.json
          '
      - name: Publish complete catalog Release
        id: release
        if: github.ref_name == 'main' && needs.generate.result == 'success' && steps.collect.outputs.complete == 'true' && steps.data.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/run-stage.sh release bash scripts/publish-release.sh
      - name: Catalog health summary
        if: always()
        env:
          MATRIX_RESULT: ${{ needs.generate.result }}
          COLLECT_COMPLETE: ${{ steps.collect.outputs.complete }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          TRANSLATE_OUTCOME: skipped
          INDEX_OUTCOME: ${{ steps.index.outcome }}
          DATA_OUTCOME: ${{ steps.data.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/write-publish-summary.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload publish diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.discover.outputs.publish-order }}-publish-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            publish-diagnostics/
            failure-logs/
            current-attempts/
            dist/index.json
            dist/translation-summary.json
            dist/translation-state.json
          retention-days: 60
          if-no-files-found: error
      - name: Fail incomplete publish
        if: always()
        env:
          RELEASE_REQUIRED: ${{ github.ref_name == 'main' }}
          MATRIX_RESULT: ${{ needs.generate.result }}
          COLLECT_COMPLETE: ${{ steps.collect.outputs.complete }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          INDEX_OUTCOME: ${{ steps.index.outcome }}
          DATA_OUTCOME: ${{ steps.data.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: |
          test "$COLLECT_OUTCOME" = success
          test "$INDEX_OUTCOME" = success
          test "$DATA_OUTCOME" = success
          test "$RELEASE_OUTCOME" != failure
          if test "$RELEASE_REQUIRED" = true && test "$MATRIX_RESULT" = success; then
            test "$COLLECT_COMPLETE" = true
            test "$RELEASE_OUTCOME" = success
          fi
