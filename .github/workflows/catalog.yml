name: Build Menuconfig Catalog
run-name: Menuconfig catalog · ${{ github.event_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * 6"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "catalog.config.json"
      - ".github/workflows/catalog.yml"

permissions:
  contents: write

concurrency:
  group: menuconfig-catalog
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/discover.mjs >> "$GITHUB_OUTPUT"

  generate:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner tools
        id: tools
        timeout-minutes: 2
        run: |
          for tool in git make gcc g++ perl python3 rsync; do
            command -v "$tool" || { echo "::error::missing runner tool: $tool"; exit 1; }
          done
      - name: Clone ${{ matrix.repo }} @ ${{ matrix.branch }}
        id: clone
        timeout-minutes: 10
        run: git clone "https://github.com/${{ matrix.repo }}" --branch "${{ matrix.branch }}" --depth 1 work/upstream
      - name: Prepare feeds
        id: feeds
        timeout-minutes: 25
        working-directory: work/upstream
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Generate upstream metadata
        id: defconfig
        timeout-minutes: 15
        working-directory: work/upstream
        run: |
          # Catalog generation does not compile firmware. FORCE only bypasses obsolete
          # host prerequisite probes in old branches; output files remain mandatory.
          make defconfig FORCE=1
          test -s tmp/.targetinfo
          test -s tmp/.packageinfo
      - name: Extract catalog
        id: extract
        timeout-minutes: 5
        run: |
          node scripts/generate-catalog.mjs \
            --source-id "${{ matrix.source }}" \
            --label "${{ matrix.label }}" \
            --repo "${{ matrix.repo }}" \
            --branch "${{ matrix.branch }}" \
            --legacy "${{ matrix.legacy }}" \
            --tree work/upstream \
            --out dist
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ matrix.source }}-${{ strategy.job-index }}
          path: |
            dist/*.json.gz
            dist/*.meta.json
          retention-days: 2
          if-no-files-found: error
      - name: Record branch attempt
        if: always()
        env:
          SOURCE_ID: ${{ matrix.source }}
          SOURCE_LABEL: ${{ matrix.label }}
          SOURCE_REPO: ${{ matrix.repo }}
          SOURCE_BRANCH: ${{ matrix.branch }}
          SOURCE_LEGACY: ${{ matrix.legacy }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          CLONE_OUTCOME: ${{ steps.clone.outcome }}
          FEEDS_OUTCOME: ${{ steps.feeds.outcome }}
          DEFCONFIG_OUTCOME: ${{ steps.defconfig.outcome }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: node scripts/write-attempt.mjs
      - name: Upload branch attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attempt-${{ matrix.source }}-${{ strategy.job-index }}
          path: attempts/*.attempt.json
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: [discover, generate]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: catalog-*
          path: current
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: attempt-*
          path: attempts
          merge-multiple: true
      - name: Keep last successful branch entries
        run: |
          git clone --branch catalog-data --depth 1 \
            "https://github.com/${{ github.repository }}" previous || true
          mkdir -p dist
          cp previous/*.json.gz dist/ 2>/dev/null || true
          cp current/*.json.gz current/*.meta.json dist/ 2>/dev/null || true
      - name: Build catalog index
        run: node scripts/build-index.mjs dist dist/index.json previous/index.json attempts
      - name: Publish catalog-data branch
        run: |
          cd dist
          rm -f -- *.meta.json
          git init
          git checkout -b catalog-data
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "data: refresh menuconfig catalog"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git push --force origin catalog-data
      - name: Publish complete catalog Release
        if: needs.generate.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete menuconfig-catalog-complete --cleanup-tag --yes || true
          gh release create menuconfig-catalog-complete \
            --target "$GITHUB_SHA" \
            --title "Complete Menuconfig Catalog" \
            --notes "All discovered source branches completed successfully in run $GITHUB_RUN_ID." \
            dist/index.json dist/*.json.gz
      - name: Catalog health summary
        if: always()
        run: |
          {
            echo "## Menuconfig catalog health"
            echo ""
            echo "- Matrix result: \`${{ needs.generate.result }}\`"
            echo "- Rolling data: \`catalog-data\`"
            echo "- Complete Release updated: \`${{ needs.generate.result == 'success' }}\`"
            echo ""
            echo '```json'
            cat dist/index.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
