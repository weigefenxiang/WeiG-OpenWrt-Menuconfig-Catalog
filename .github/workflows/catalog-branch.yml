name: Catalog Native branch pipeline

on:
  workflow_call:
    inputs:
      branch:
        type: string
        required: true
      shards:
        type: number
        default: 4

permissions:
  contents: read

env:
  CATALOG_SOURCE_ID: ${{ fromJSON(inputs.branch).source }}
  CATALOG_SOURCE_LABEL: ${{ fromJSON(inputs.branch).label }}
  CATALOG_REPO: ${{ fromJSON(inputs.branch).repo }}
  CATALOG_BRANCH: ${{ fromJSON(inputs.branch).branch }}
  CATALOG_VERSION: ${{ fromJSON(inputs.branch).version }}
  CATALOG_COMPAT: ${{ fromJSON(inputs.branch).metadataCompat }}
  CATALOG_JOB_KEY: ${{ fromJSON(inputs.branch).jobKey }}
  CATALOG_ORDER: ${{ fromJSON(inputs.branch).orderText }}
  CATALOG_JOB_NAME: ${{ fromJSON(inputs.branch).jobName }}
  CATALOG_RUN_ID: ${{ github.run_id }}
  CATALOG_RUN_ATTEMPT: ${{ github.run_attempt }}
  CATALOG_JOB_INDEX: ${{ fromJSON(inputs.branch).orderText }}
  CATALOG_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  CATALOG_ARTIFACT_NAME: ${{ fromJSON(inputs.branch).artifactPrefix }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}

jobs:
  prepare:
    name: Prepare exact Native inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      matrix: ${{ steps.profile_plan.outputs.matrix }}
      distributed: ${{ steps.profile_plan.outputs.distributed }}
      inline-result: ${{ steps.inline.outcome }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify runner tools
        id: tools
        timeout-minutes: 2
        run: |
          bash scripts/run-stage.sh tools bash -c \
            'for tool in git make gcc g++ perl python3 rsync; do command -v "$tool" || { echo "missing runner tool: $tool"; exit 1; }; done'
      - name: Clone ${{ fromJSON(inputs.branch).repo }} @ ${{ fromJSON(inputs.branch).branch }}
        id: clone
        timeout-minutes: 10
        run: bash scripts/run-stage.sh clone bash scripts/clone-upstream.sh "https://github.com/${{ fromJSON(inputs.branch).repo }}" "${{ fromJSON(inputs.branch).branch }}" work/upstream
      - name: Prepare feeds
        id: feeds
        # Three attempts on each of three trusted providers can take just over
        # 27 minutes at the bounded 180-second per-attempt timeout.  Keep the
        # stage deadline above that bound so an exhausted feed emits its
        # structured feed-fetch-infrastructure result instead of being killed
        # by the workflow timeout first.
        timeout-minutes: 35
        working-directory: work/upstream
        env:
          PROBE_LOG: ${{ runner.temp }}/catalog-feeds.log
          PROBE_FEEDS_RUNTIME: ${{ github.workspace }}/probe-feeds-runtime.json
          PROBE_SOURCE: ${{ fromJSON(inputs.branch).source }}
          PROBE_BRANCH: ${{ fromJSON(inputs.branch).branch }}
          PROBE_FEED_BACKOFF_BASE_SECONDS: 10
        run: bash "$GITHUB_WORKSPACE/scripts/run-stage.sh" feeds bash "$GITHUB_WORKSPACE/scripts/install-probe-feeds.sh"
      - name: Generate upstream metadata
        id: metadata
        timeout-minutes: 15
        working-directory: work/upstream
        run: bash "$GITHUB_WORKSPACE/scripts/run-stage.sh" metadata bash "$GITHUB_WORKSPACE/scripts/prepare-metadata.sh" "${{ fromJSON(inputs.branch).metadataCompat }}"
      - name: Extract catalog
        id: extract
        timeout-minutes: 5
        run: |
          bash scripts/run-stage.sh extract node scripts/generate-catalog.mjs \
            --source-id "${{ fromJSON(inputs.branch).source }}" \
            --label "${{ fromJSON(inputs.branch).label }}" \
            --repo "${{ fromJSON(inputs.branch).repo }}" \
            --branch "${{ fromJSON(inputs.branch).branch }}" \
            --default-branch "${{ fromJSON(inputs.branch).defaultBranch }}" \
            --legacy "${{ fromJSON(inputs.branch).legacy }}" \
            --tree work/upstream \
            --feeds-runtime probe-feeds-runtime.json \
            --out dist
      - name: Verify Target/Profile Kconfig contracts
        id: kconfig_contract
        if: steps.extract.outcome == 'success'
        timeout-minutes: 12
        run: |
          bash scripts/run-stage.sh kconfig-contract node scripts/verify-target-contracts.mjs \
            --tree work/upstream \
            --source-id "${{ fromJSON(inputs.branch).source }}" \
            --branch "${{ fromJSON(inputs.branch).branch }}" \
            --out dist
      - name: Prepare Native Profile shard plan
        id: profile_plan
        timeout-minutes: 10
        run: |
          bash scripts/run-stage.sh profile-plan node scripts/profile-config-pipeline.mjs prepare \
            --source-id "${{ fromJSON(inputs.branch).source }}" \
            --branch "${{ fromJSON(inputs.branch).branch }}" --max-shards "${{ inputs.shards }}"
      - name: Generate small branches without cross-runner transfers
        id: inline
        if: steps.profile_plan.outputs.distributed == 'false'
        timeout-minutes: 45
        run: |
          bash scripts/run-stage.sh profile-config-groups bash -euc '
            node scripts/profile-config-pipeline.mjs shard --shard 0
            node scripts/profile-config-pipeline.mjs merge --rows profile-work
            node scripts/profile-config-pipeline.mjs parity --shard 0
            node scripts/profile-config-pipeline.mjs finalize --receipts profile-work
          '
      - name: Pack the exact prepared tree once for distributed jobs
        id: pack
        if: steps.profile_plan.outputs.distributed == 'true'
        timeout-minutes: 10
        run: bash scripts/run-stage.sh native-input-pack tar -I 'gzip -1' -cf native-tree.tar.gz work/upstream
      - name: Record branch attempt
        if: always()
        env:
          SOURCE_ID: ${{ fromJSON(inputs.branch).source }}
          SOURCE_LABEL: ${{ fromJSON(inputs.branch).label }}
          SOURCE_REPO: ${{ fromJSON(inputs.branch).repo }}
          SOURCE_BRANCH: ${{ fromJSON(inputs.branch).branch }}
          SOURCE_VERSION: ${{ fromJSON(inputs.branch).version }}
          SOURCE_LEGACY: ${{ fromJSON(inputs.branch).legacy }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_INDEX: ${{ fromJSON(inputs.branch).orderText }}
          CATALOG_ORDER: ${{ fromJSON(inputs.branch).orderText }}
          CATALOG_JOB_NAME: ${{ fromJSON(inputs.branch).jobName }}
          CATALOG_JOB_KEY: ${{ fromJSON(inputs.branch).jobKey }}
          CATALOG_ARTIFACT_NAME: ${{ fromJSON(inputs.branch).artifactPrefix }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          METADATA_COMPAT: ${{ fromJSON(inputs.branch).metadataCompat }}
          JOB_STATUS: ${{ job.status }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          CLONE_OUTCOME: ${{ steps.clone.outcome }}
          FEEDS_OUTCOME: ${{ steps.feeds.outcome }}
          FEEDS_FAILURE_REASON: ${{ steps.feeds.outputs.failure_reason }}
          FEEDS_FAILURE_CLASS: ${{ steps.feeds.outputs.failure_class }}
          FEEDS_FAILURE_FEED: ${{ steps.feeds.outputs.failure_feed }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          KCONFIG_CONTRACT_OUTCOME: ${{ steps.kconfig_contract.outcome }}
          PROFILE_PLAN_OUTCOME: ${{ steps.profile_plan.outcome }}
          PROFILE_INLINE_OUTCOME: ${{ steps.inline.outcome }}
          PROFILE_PACK_OUTCOME: ${{ steps.pack.outcome }}
        run: node scripts/write-attempt.mjs
      - name: Upload branch result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-input-${{ fromJSON(inputs.branch).jobKey }}-run-${{ github.run_id }}
          overwrite: true
          compression-level: 0
          path: |
            native-tree.tar.gz
            profile-work/plan.json
            dist/*.json.gz
            dist/*.meta.json
            dist/*.contract.json
            dist/*.translations.json
            dist/*.duplicates.json
            dist/*.curated-candidates.json
            attempts/*.attempt.json
            attempts/*--SUMMARY.txt
            probe-feeds-runtime.json
            failure-logs/*.log
          retention-days: 7
          if-no-files-found: error

  native:
    name: Native Profile shard ${{ matrix.shard }}
    needs: prepare
    if: needs.prepare.outputs.distributed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.shards }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-input-${{ fromJSON(inputs.branch).jobKey }}-run-${{ github.run_id }}
          path: .
      - name: Restore exact Native tree and generate shard
        run: |
          tar -xzf native-tree.tar.gz
          bash scripts/run-stage.sh profile-shard-${{ matrix.shard }} \
            node scripts/profile-config-pipeline.mjs shard --shard "${{ matrix.shard }}"
      - name: Upload Native shard and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-rows-${{ fromJSON(inputs.branch).jobKey }}-${{ matrix.shard }}-run-${{ github.run_id }}
          overwrite: true
          compression-level: 0
          path: |
            profile-work/rows-*.json.gz
            failure-logs/*.log
          retention-days: 7

  group:
    name: Merge exact Profile groups
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.merge.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-input-${{ fromJSON(inputs.branch).jobKey }}-run-${{ github.run_id }}
          path: .
      - uses: actions/download-artifact@v8
        with:
          pattern: native-rows-${{ fromJSON(inputs.branch).jobKey }}-*-run-${{ github.run_id }}
          path: native-results
      - name: Assemble shard rows without hiding duplicates
        run: |
          mkdir -p profile-rows
          find native-results -name 'rows-*.json.gz' -exec cp --no-clobber '{}' profile-rows/ \;
          test "$(find native-results -name 'rows-*.json.gz' | wc -l)" -eq "$(find profile-rows -name 'rows-*.json.gz' | wc -l)"
      - name: Group once and preserve the global parity sample plan
        id: merge
        run: bash scripts/run-stage.sh profile-merge node scripts/profile-config-pipeline.mjs merge
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-group-${{ fromJSON(inputs.branch).jobKey }}-run-${{ github.run_id }}
          overwrite: true
          compression-level: 0
          path: |
            profile-work/draft.json.gz
            profile-work/parity-plan.json.gz
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-merge-log-${{ fromJSON(inputs.branch).jobKey }}-run-${{ github.run_id }}
          overwrite: true
          path: failure-logs/
          retention-days: 7

  parity:
    name: Isolated make defconfig shard ${{ matrix.shard }}
    needs: group
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.shards }}
      matrix: ${{ fromJSON(needs.group.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-input-${{ fromJSON(inputs.branch).jobKey }}-run-${{ github.run_id }}
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: native-group-${{ fromJSON(inputs.branch).jobKey }}-run-${{ github.run_id }}
          path: profile-work
      - name: Compare with make defconfig in an independent runner
        run: |
          tar -xzf native-tree.tar.gz
          bash scripts/run-stage.sh profile-parity-${{ matrix.shard }} \
            node scripts/profile-config-pipeline.mjs parity --shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-parity-${{ fromJSON(inputs.branch).jobKey }}-${{ matrix.shard }}-run-${{ github.run_id }}
          overwrite: true
          path: |
            profile-work/parity-*.json
            failure-logs/*.log
          retention-days: 7

  finalize:
    name: Finalize complete branch result
    needs: [prepare, native, group, parity]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-input-${{ fromJSON(inputs.branch).jobKey }}-run-${{ github.run_id }}
          path: .
      - name: Download grouped Profile document
        if: needs.group.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: native-group-${{ fromJSON(inputs.branch).jobKey }}-run-${{ github.run_id }}
          path: profile-work
      - name: Download parity receipts
        if: needs.parity.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: native-parity-${{ fromJSON(inputs.branch).jobKey }}-*-run-${{ github.run_id }}
          path: parity-results
      - name: Validate complete receipt coverage and write existing assets
        id: experiment
        env:
          PROFILE_NATIVE_RESULT: ${{ needs.native.result }}
          PROFILE_MERGE_RESULT: ${{ needs.group.result }}
          PROFILE_PARITY_RESULT: ${{ needs.parity.result }}
          PROFILE_INLINE_RESULT: ${{ needs.prepare.outputs.inline-result }}
          PROFILE_PREPARE_RESULT: ${{ needs.prepare.result }}
        run: |
          if [[ "$PROFILE_INLINE_RESULT" == success && "$PROFILE_PREPARE_RESULT" == success ]]; then
            echo 'Small branch assets already passed Native generation and parity in the preparation runner.'
            exit 0
          fi
          mkdir -p profile-receipts
          if [[ -d parity-results ]]; then
            find parity-results -name 'parity-*.json' -exec cp --no-clobber '{}' profile-receipts/ \;
            test "$(find parity-results -name 'parity-*.json' | wc -l)" -eq "$(find profile-receipts -name 'parity-*.json' | wc -l)"
          fi
          bash scripts/run-stage.sh profile-finalize node scripts/profile-config-pipeline.mjs finalize
      - name: Record branch attempt
        if: always()
        env:
          SOURCE_ID: ${{ fromJSON(inputs.branch).source }}
          SOURCE_LABEL: ${{ fromJSON(inputs.branch).label }}
          SOURCE_REPO: ${{ fromJSON(inputs.branch).repo }}
          SOURCE_BRANCH: ${{ fromJSON(inputs.branch).branch }}
          SOURCE_VERSION: ${{ fromJSON(inputs.branch).version }}
          SOURCE_LEGACY: ${{ fromJSON(inputs.branch).legacy }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_INDEX: ${{ fromJSON(inputs.branch).orderText }}
          CATALOG_ORDER: ${{ fromJSON(inputs.branch).orderText }}
          CATALOG_JOB_NAME: ${{ fromJSON(inputs.branch).jobName }}
          CATALOG_JOB_KEY: ${{ fromJSON(inputs.branch).jobKey }}
          CATALOG_ARTIFACT_NAME: ${{ fromJSON(inputs.branch).artifactPrefix }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          METADATA_COMPAT: ${{ fromJSON(inputs.branch).metadataCompat }}
          JOB_STATUS: ${{ job.status }}
          EXPERIMENT_STAGE: profile-finalize
          PREVIOUS_ATTEMPT_FILE: attempts/${{ fromJSON(inputs.branch).orderText }}-${{ fromJSON(inputs.branch).jobKey }}.attempt.json
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: node scripts/write-attempt.mjs
      - name: Upload branch result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ fromJSON(inputs.branch).artifactPrefix }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            dist/*.json.gz
            dist/*.meta.json
            dist/*.contract.json
            dist/*.translations.json
            dist/*.duplicates.json
            dist/*.curated-candidates.json
            attempts/*.attempt.json
            attempts/*--SUMMARY.txt
            probe-feeds-runtime.json
            failure-logs/*.log
          retention-days: 60
          if-no-files-found: error
