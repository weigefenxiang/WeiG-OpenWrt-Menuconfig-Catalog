name: Package Compatibility Probe / 软件包兼容探针
description: Upload the probe-request.json generated by WeiG OpenWrt AutoBuild / 上传由 WeiG OpenWrt AutoBuild 生成的 probe-request.json
title: "[probe] "
body:
  - type: markdown
    attributes:
      value: |
        ## Submit a package probe / 提交软件包探针

        In WeiG OpenWrt AutoBuild, choose the packages, depth, Source/Branch scope, and Target coverage, then click **Submit probe**. The page downloads `probe-request.json` and opens this form. / 在 WeiG OpenWrt AutoBuild 中选择软件包、探测深度、Source/Branch 范围和 Target 覆盖，然后点击 **提交探针**。网页会下载 `probe-request.json` 并打开此表单。

        Drag that JSON file into the field below. Do not edit it or add secrets. The attachment and this Issue are public. / 把该 JSON 文件拖入下方字段。请勿修改文件，也不要加入秘密信息；附件和本 Issue 都是公开的。
  - type: upload
    id: request
    attributes:
      label: Probe request JSON / 探针请求 JSON
      description: Upload exactly one probe-request.json generated by the web page. / 只上传一个由网页生成的 probe-request.json。
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        After submission, Catalog validates the attachment and posts the Run link in this Issue. Only the repository owner or a collaborator with write access can start the Matrix. To cancel, reply with exactly `/cancel` in this Issue. / 提交后，Catalog 会校验附件，并在本 Issue 回复 Run 链接。只有仓库所有者或具有写权限的协作者可以启动 Matrix。如需取消，请在本 Issue 准确回复 `/cancel`。
